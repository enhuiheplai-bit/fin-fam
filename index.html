<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Fin-Fam</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5c5c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fin-Fam">
<style>
:root{--bg:#f4f6f4;--card:#fff;--ink:#1b2a2f;--mute:#62747a;--line:#dce4e2;--main:#0f5c5c;--in:#1d7a4d;--out:#b4432f}
@media(prefers-color-scheme:dark){:root{--bg:#121a1c;--card:#1b2629;--ink:#e8efee;--mute:#93a5a9;--line:#2c3b3f;--main:#4fb3a9;--in:#58c58b;--out:#ef8a74}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font:700 1.4rem Georgia,serif;margin:0 0 12px}
h2{font-size:1rem;margin:20px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mnav b{text-transform:capitalize;font-size:1.05rem}
button,select,input{font:inherit;color:inherit}
button{background:var(--main);color:#fff;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}
button.ghost{background:transparent;color:var(--main);border:1px solid var(--line)}
button.del{background:transparent;color:var(--out);padding:4px 8px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin:4px 0 12px}
label{font-size:.9rem;color:var(--mute)}
.big{font:700 2rem Georgia,serif}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center}
.in{color:var(--in)}.out{color:var(--out)}.mute{color:var(--mute);font-size:.9rem}
.bar{height:8px;background:var(--line);border-radius:4px;margin:4px 0 12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--main)}
.tx{padding:10px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border:0}
.chk{display:flex;gap:14px;flex-wrap:wrap;margin:4px 0 12px}
.chk label{display:flex;align-items:center;gap:6px;color:var(--ink)}
.chk input{width:auto;margin:0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--mute);border-radius:0;padding:14px 4px;font-size:.78rem}
nav button.on{color:var(--main);font-weight:700}
.empty{text-align:center;color:var(--mute);padding:28px 8px}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='finfam-v1';
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.tx)S={tx:[]};
if(!S.inv)S.inv=[];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const GR=[
['Self',['🍲 SPESA','🍝 CIBO/FUORI','👚 ABBIGLIAMENTO','💻 HOBBY','💅 CURA PERSONALE','📖 ISTRUZIONE','🩺 SALUTE','🎁 REGALI','✈️ VIAGGI/VACANZE','📈 INVESTIMENTI','💸 TASSE']],
['Baby',['🍼 BABY/Care','🧷 BABY/Salute','🧦 BABY/Abbigliamento']],
['Casa',['💡 LUCE','🕯️ GAS','💧 ACQUA','📞 TELEFONO','🏠 CONDOMINIO','🏘️ CONDOMINIO AREA CORTILIVA','🗑️ TARI']],
['Trasporto',['🚗 Varie','🚗 AUTO_FORD_Altro','🚗 Auto_Moto_Carburante','🚗 Auto_Moto_Altro']]];
const CI=['💼 Stipendio','➕ Altre entrate'];
const grpOf=c=>(GR.find(g=>g[1].includes(c))||['Altro'])[0];
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
let tab='home',month=today().slice(0,7),iv={v:'list',id:null};
const eur=n=>n.toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const sg=n=>(n>=0?'+':'−')+eur(Math.abs(n));
const pct=n=>(n>=0?'+':'−')+Math.abs(n).toFixed(2).replace('.',',')+'%';
const num=id=>parseFloat(($('#'+id).value||'').replace(',','.'));
const fd=d=>new Date(d+'T00:00').toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'2-digit'});
const mName=m=>{const [y,mo]=m.split('-');return new Date(y,mo-1,1).toLocaleDateString('it-IT',{month:'long',year:'numeric'})};
const shift=d=>{const [y,m]=month.split('-').map(Number);const dt=new Date(y,m-1+d,1);month=dt.getFullYear()+'-'+pad(dt.getMonth()+1);render()};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const monthTx=()=>S.tx.filter(t=>t.type!=='pay'&&t.date.startsWith(month)).sort((a,b)=>b.date.localeCompare(a.date));
const mnav=()=>`<div class="mnav"><button class="ghost" onclick="shift(-1)">‹</button><b>${mName(month)}</b><button class="ghost" onclick="shift(1)">›</button></div>`;

function home(){
  const tx=monthTx(),inc=tx.filter(t=>t.type==='in').reduce((a,t)=>a+t.amount,0),
  out=tx.filter(t=>t.type==='out').reduce((a,t)=>a+t.amount,0),g={};
  tx.filter(t=>t.type==='out').forEach(t=>{const k=grpOf(t.cat);g[k]=g[k]||{tot:0,c:{}};g[k].tot+=t.amount;g[k].c[t.cat]=(g[k].c[t.cat]||0)+t.amount});
  const groups=Object.entries(g).sort((a,b)=>b[1].tot-a[1].tot);
  return `<h1>Fin-Fam</h1>${mnav()}
  <div class="card"><div class="mute">Saldo del mese</div><div class="big ${inc-out<0?'out':'in'}">${eur(inc-out)}</div>
  <div class="row" style="margin-top:8px"><span class="in">Entrate ${eur(inc)}</span><span class="out">Uscite ${eur(out)}</span></div></div>
  <h2>Spese per categoria</h2>${groups.length?groups.map(([n,x])=>`<div class="card"><div class="row"><b>${esc(n)}</b><b>${eur(x.tot)}</b></div><div style="height:8px"></div>${Object.entries(x.c).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div class="row"><span>${esc(c)}</span><span>${eur(v)}</span></div><div class="bar"><i style="width:${v/out*100}%"></i></div>`).join('')}</div>`).join(''):'<div class="card empty">Nessuna spesa questo mese.<br>Tocca “Aggiungi” per registrarne una.</div>'}`;
}

function add(){
  return `<h1>Aggiungi</h1><div class="card">
  <label>Tipo</label><select id="f-type" onchange="setCats()"><option value="out">Spesa</option><option value="in">Entrata</option></select>
  <label>Importo (€)</label><input id="f-amt" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0,00">
  <label>Categoria</label><select id="f-cat"></select>
  <label>Data</label><input id="f-date" type="date" value="${today()}">
  <label>Nota (facoltativa)</label><input id="f-note" placeholder="Es. spesa al supermercato">
  <button style="width:100%;margin-top:8px" onclick="addTx()">Salva</button></div>`;
}
function setCats(){
  const t=$('#f-type').value;
  $('#f-cat').innerHTML=t==='in'?CI.map(c=>`<option>${c}</option>`).join(''):GR.map(([n,l])=>`<optgroup label="${n}">${l.map(c=>`<option>${c}</option>`).join('')}</optgroup>`).join('');
}
function addTx(){
  const amount=Math.round(num('f-amt')*100)/100;
  if(!(amount>0)){alert('Inserisci un importo maggiore di zero.');return}
  const date=$('#f-date').value||today();
  S.tx.push({id:uid(),type:$('#f-type').value,amount,cat:$('#f-cat').value,date,note:$('#f-note').value.trim()});
  save();month=date.slice(0,7);tab='list';render();
}

function list(){
  const tx=monthTx();
  return `<h1>Movimenti</h1>${mnav()}<div class="card">${tx.length?tx.map(t=>{
    const cls=t.type==='in'?'in':'out',sign=t.type==='in'?'+':'−';
    return `<div class="tx row"><div><div>${esc(t.cat)}${t.note?' · '+esc(t.note):''}</div><div class="mute">${fd(t.date)}</div></div><div class="row"><b class="${cls}">${sign}${eur(t.amount)}</b><button class="del" onclick="del('${t.id}')" aria-label="Elimina">✕</button></div></div>`}).join(''):'<div class="empty">Nessun movimento in questo mese.</div>'}</div>`;
}
function del(id){if(confirm('Eliminare questo movimento?')){S.tx=S.tx.filter(t=>t.id!==id);save();render()}}

/* ---------- Investimenti ---------- */
const fac=a=>a.kind==='BTP'?0.01:1;
function series(a){
  const m={};
  a.ops.filter(o=>o.type!=='div').forEach(o=>m[o.date]=o.price);
  (a.prices||[]).forEach(p=>m[p.date]=p.price);
  return Object.entries(m).sort((x,y)=>x[0].localeCompare(y[0])).map(([date,price])=>({date,price}));
}
function calc(a){
  let q=0,cost=0,real=0,inc=0;
  [...a.ops].sort((x,y)=>x.date.localeCompare(y.date)).forEach(o=>{
    if(o.type==='buy'){cost+=o.qty*o.price*fac(a)+(o.fee||0);q+=o.qty}
    else if(o.type==='sell'){const avg=q?cost/q:0;real+=o.qty*o.price*fac(a)-(o.fee||0)-avg*o.qty;cost-=avg*o.qty;q-=o.qty}
    else inc+=o.amount});
  if(q<1e-9){q=0;cost=0}
  const pts=series(a),last=pts[pts.length-1],prev=pts[pts.length-2],price=last?last.price:0,value=q*price*fac(a);
  return {q,cost,real,inc,price,value,pl:value-cost,pts,last,prev,avg:q?cost/q/fac(a):0};
}
function spark(p){
  if(p.length<2)return '';
  const v=p.map(x=>x.price),mn=Math.min(...v),mx=Math.max(...v),W=300,H=50;
  const pts=v.map((y,i)=>`${(i/(v.length-1)*W).toFixed(1)},${(H-(mx===mn?H/2:(y-mn)/(mx-mn)*(H-6)+3)).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:50px"><polyline points="${pts}" fill="none" stroke="var(--main)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}
const vari=c=>c.prev?`<span class="${c.last.price>=c.prev.price?'in':'out'}">${pct((c.last.price/c.prev.price-1)*100)}</span> <span class="mute">da ${fd(c.prev.date)}</span>`:'<span class="mute">prezzo da aggiornare</span>';

function invest(){
  if(iv.v==='form')return invForm();
  if(iv.v==='det')return invDet();
  const rows=S.inv.map(a=>({a,c:calc(a)}));
  const val=rows.reduce((s,r)=>s+r.c.value,0),cost=rows.reduce((s,r)=>s+r.c.cost,0),got=rows.reduce((s,r)=>s+r.c.real+r.c.inc,0),pl=val-cost;
  return `<h1>Investimenti</h1>
  <div class="card"><div class="mute">Valore attuale</div><div class="big">${eur(val)}</div>
  <div class="row"><span class="mute">Investito ${eur(cost)}</span><b class="${pl>=0?'in':'out'}">${sg(pl)} (${pct(cost?pl/cost*100:0)})</b></div>
  <div class="mute" style="margin-top:6px">Già incassato (vendite e cedole): ${sg(got)}</div></div>
  <button style="width:100%;margin-bottom:12px" onclick="iv={v:'form',id:null};render()">+ Registra operazione</button>
  ${rows.length?rows.map(({a,c})=>`<div class="card" style="cursor:pointer" onclick="iv={v:'det',id:'${a.id}'};render()">
  <div class="row"><b>${esc(a.name)}</b><span class="mute">${esc(a.kind)}</span></div>
  <div class="row" style="margin-top:6px"><span class="mute">${c.q?`${c.q.toLocaleString('it-IT')} ${a.kind==='BTP'?'€ nominali':'quote'}`:'Posizione chiusa'}</span><b>${eur(c.value)}</b></div>
  <div class="row"><span>${c.last?eur(c.price)+' '+vari(c):'—'}</span>${c.q?`<b class="${c.pl>=0?'in':'out'}">${sg(c.pl)}</b>`:''}</div></div>`).join(''):'<div class="card empty">Nessun titolo. Tocca “Registra operazione” per inserire il primo acquisto.</div>'}`;
}
function invDet(){
  const a=S.inv.find(x=>x.id===iv.id);if(!a){iv={v:'list'};return invest()}
  const c=calc(a),ops=[...a.ops].sort((x,y)=>y.date.localeCompare(x.date));
  const R=(l,v)=>`<div class="row" style="padding:4px 0"><span class="mute">${l}</span><span>${v}</span></div>`;
  return `<button class="ghost" onclick="iv={v:'list'};render()">‹ Indietro</button>
  <h1 style="margin-top:12px">${esc(a.name)} <span class="mute" style="font:400 .9rem system-ui">${esc(a.kind)}</span></h1>
  <div class="card">${R(a.kind==='BTP'?'Valore nominale':'Quote',c.q.toLocaleString('it-IT'))}
  ${R('Prezzo medio di carico',c.q?eur(c.avg):'—')}
  ${R('Prezzo attuale'+(c.last?' ('+fd(c.last.date)+')':''),c.last?eur(c.price):'—')}
  ${R('Variazione',vari(c))}
  ${R('Valore attuale',eur(c.value))}
  ${R('Utile/perdita latente',c.q?`<b class="${c.pl>=0?'in':'out'}">${sg(c.pl)} (${pct(c.cost?c.pl/c.cost*100:0)})</b>`:'—')}
  ${R('Realizzato con vendite',sg(c.real))}
  ${R('Cedole / dividendi',eur(c.inc))}
  <div style="margin-top:10px">${spark(c.pts)}</div></div>
  <div class="row" style="gap:8px;margin-bottom:12px"><button style="flex:1" onclick="updPrice('${a.id}')">Aggiorna prezzo</button><button class="ghost" style="flex:1" onclick="iv={v:'form',id:'${a.id}'};render()">+ Operazione</button></div>
  <h2>Operazioni</h2><div class="card">${ops.map(o=>`<div class="tx row"><div><div>${o.type==='buy'?'Acquisto':o.type==='sell'?'Vendita':'Cedola/dividendo'}${o.type==='div'?'':' · '+o.qty.toLocaleString('it-IT')+' a '+eur(o.price)}</div><div class="mute">${fd(o.date)}${o.fee?' · comm. '+eur(o.fee):''}</div></div><div class="row"><b>${o.type==='div'?eur(o.amount):eur(o.qty*o.price*fac(a))}</b><button class="del" onclick="delOp('${a.id}','${o.id}')" aria-label="Elimina">✕</button></div></div>`).join('')||'<div class="empty">Nessuna operazione.</div>'}</div>
  <button class="ghost" style="width:100%;color:var(--out)" onclick="delAsset('${a.id}')">Elimina questo titolo</button>`;
}
function invForm(){
  return `<button class="ghost" onclick="iv={v:iv.id?'det':'list',id:iv.id};render()">‹ Indietro</button><h1 style="margin-top:12px">Registra operazione</h1><div class="card">
  <label>Titolo</label><select id="i-a" onchange="invTog()">${S.inv.map(a=>`<option value="${a.id}" ${a.id===iv.id?'selected':''}>${esc(a.name)}</option>`).join('')}<option value="new" ${S.inv.length?'':'selected'}>➕ Nuovo titolo…</option></select>
  <div id="i-new"><label>Nome del titolo</label><input id="i-n" placeholder="Es. BTP Italia 2030 / VWCE"><label>Tipo</label><select id="i-k"><option>ETF</option><option>BTP</option><option>Azione</option><option>Altro</option></select></div>
  <label>Operazione</label><select id="i-t" onchange="invTog()"><option value="buy">Acquisto</option><option value="sell">Vendita</option><option value="div">Cedola / dividendo incassato</option></select>
  <label>Data</label><input id="i-d" type="date" value="${today()}">
  <div id="i-op"><label>Quantità (per i BTP: valore nominale in €)</label><input id="i-q" type="number" inputmode="decimal" step="any" min="0">
  <label>Prezzo unitario (per i BTP: prezzo ogni 100 €)</label><input id="i-p" type="number" inputmode="decimal" step="any" min="0">
  <label>Commissioni (€, facoltative)</label><input id="i-f" type="number" inputmode="decimal" step="any" min="0"></div>
  <div id="i-dv"><label>Importo incassato (€)</label><input id="i-m" type="number" inputmode="decimal" step="any" min="0"></div>
  <button style="width:100%;margin-top:8px" onclick="saveOp()">Salva</button></div>`;
}
function invTog(){
  $('#i-new').hidden=$('#i-a').value!=='new';
  const d=$('#i-t').value==='div';$('#i-op').hidden=d;$('#i-dv').hidden=!d;
}
function saveOp(){
  const sel=$('#i-a').value,type=$('#i-t').value,o={id:uid(),date:$('#i-d').value||today(),type};
  if(type==='div'){o.amount=num('i-m');if(!(o.amount>0))return alert('Inserisci l’importo incassato.')}
  else{o.qty=num('i-q');o.price=num('i-p');o.fee=num('i-f')||0;if(!(o.qty>0&&o.price>0))return alert('Inserisci quantità e prezzo.')}
  let a;
  if(sel==='new'){
    const n=$('#i-n').value.trim();
    if(!n)return alert('Scrivi il nome del titolo.');
    if(type!=='buy')return alert('Un nuovo titolo parte da un acquisto.');
    a={id:uid(),name:n,kind:$('#i-k').value,ops:[],prices:[]};S.inv.push(a);
  }else{
    a=S.inv.find(x=>x.id===sel);
    if(type==='sell'&&o.qty>calc(a).q+1e-9)return alert('Stai vendendo più di quanto possiedi.');
  }
  a.ops.push(o);save();iv={v:'det',id:a.id};render();
}
function updPrice(id){
  const a=S.inv.find(x=>x.id===id),v=parseFloat((prompt('Prezzo attuale'+(a.kind==='BTP'?' (ogni 100 €)':''))||'').replace(',','.'));
  if(!(v>0))return;
  a.prices=(a.prices||[]).filter(p=>p.date!==today());a.prices.push({date:today(),price:v});save();render();
}
function delOp(aid,oid){if(confirm('Eliminare questa operazione?')){const a=S.inv.find(x=>x.id===aid);a.ops=a.ops.filter(o=>o.id!==oid);save();render()}}
function delAsset(id){if(confirm('Eliminare il titolo e tutte le sue operazioni?')){S.inv=S.inv.filter(a=>a.id!==id);save();iv={v:'list'};render()}}

function settings(){
  return `<h1>Impostazioni</h1><div class="card"><h2 style="margin-top:0">Copia di sicurezza</h2><p class="mute">I dati sono salvati su questo dispositivo. Scarica una copia per non perderli.</p><button onclick="backup()">Scarica copia dei dati</button></div>`;
}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='fin-fam-dati-'+today()+'.json';a.click()}

const TABS=[['home','Riepilogo'],['add','Aggiungi'],['list','Movimenti'],['inv','Investimenti'],['settings','Impostazioni']];
const go=k=>{tab=k;if(k==='inv')iv={v:'list',id:null};render();scrollTo(0,0)};
function render(){
  $('#app').innerHTML={home,add,list,inv:invest,settings}[tab]();
  $('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
  if(tab==='add')setCats();
  if(tab==='inv'&&iv.v==='form')invTog();
}
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
