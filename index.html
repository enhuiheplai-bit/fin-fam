<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Fin-Fam</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5c5c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fin-Fam">
<style>
:root{--bg:#f4f6f4;--card:#fff;--ink:#1b2a2f;--mute:#62747a;--line:#dce4e2;--main:#0f5c5c;--in:#1d7a4d;--out:#b4432f;--alt:#b7791f;--c3:#6a4fc2}
@media(prefers-color-scheme:dark){:root{--bg:#121a1c;--card:#1b2629;--ink:#e8efee;--mute:#93a5a9;--line:#2c3b3f;--main:#4fb3a9;--in:#58c58b;--out:#ef8a74;--alt:#e0a74a;--c3:#a995ff}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font:700 1.4rem Georgia,serif;margin:0 0 12px}
h2{font-size:1rem;margin:20px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mnav b{text-transform:capitalize;font-size:1.05rem}
button,select,input{font:inherit;color:inherit}
button{background:var(--main);color:#fff;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}
button.ghost{background:transparent;color:var(--main);border:1px solid var(--line)}
button.del{background:transparent;color:var(--out);padding:4px 8px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin:4px 0 12px}
label{font-size:.9rem;color:var(--mute)}
.big{font:700 2rem Georgia,serif}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center}
.in{color:var(--in)}.out{color:var(--out)}.mute{color:var(--mute);font-size:.9rem}
.bar{height:8px;background:var(--line);border-radius:4px;margin:4px 0 12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--main)}
.tx{padding:10px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border:0}
.chk{display:flex;gap:14px;flex-wrap:wrap;margin:4px 0 12px}
.chk label{display:flex;align-items:center;gap:6px;color:var(--ink)}
.chk input{width:auto;margin:0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--mute);border-radius:0;padding:14px 4px;font-size:.78rem}
nav button.on{color:var(--main);font-weight:700}
.empty{text-align:center;color:var(--mute);padding:28px 8px}
.seg{display:flex;margin-bottom:12px}.seg button{flex:1;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:0}.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}.seg button.on{background:var(--main);color:#fff;border-color:var(--main)}
summary{list-style:none;cursor:pointer;padding:6px 0}summary::-webkit-details-marker{display:none}
.ic{background:transparent;color:var(--main);padding:4px 7px}
.leg{display:flex;gap:14px;font-size:.85rem;color:var(--mute);margin-bottom:4px}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
table{border-collapse:collapse;width:100%;font-size:.8rem}th,td{padding:5px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}th:first-child,td:first-child{text-align:left}
.pricebox{border-color:var(--main);border-width:2px}
.leg{flex-wrap:wrap}.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.fgrid select{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}.chip{padding:6px 11px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font-size:.82rem}.chip.on{background:var(--main);color:#fff;border-color:var(--main)}
nav button{padding:7px 2px 8px;font-size:.64rem;line-height:1.25}nav button span{display:block;font-size:1.15rem}body{padding-bottom:calc(88px + env(safe-area-inset-bottom))}.nwi input{width:130px;margin:2px 0;text-align:right}.nwr{padding:2px 0}.nwi{white-space:nowrap}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='finfam-v1';
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.tx)S={tx:[]};
if(!S.inv)S.inv=[];
if(!S.pacs)S.pacs=['PAC1','PAC2'];
if(!S.cash)S.cash=[];
if(!S.agos)S.agos={amt:580,until:'2028-11'};
if(!S.nwd)S.nwd=nwDef0();
if(!S.nws)S.nws={};
S.inv.forEach(a=>{if(!a.pac)a.pac=S.pacs[0]});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(DR.connected){DR.dirty=true;drSave();drAuto()}};
const GR=[
['Self',['🍲 SPESA','🍝 CIBO/FUORI','👚 ABBIGLIAMENTO','💻 HOBBY','💅 CURA PERSONALE','📖 ISTRUZIONE','🩺 SALUTE','🎁 REGALI','✈️ VIAGGI/VACANZE','📈 INVESTIMENTI','💸 TASSE']],
['Baby',['🍼 BABY/Care','🧷 BABY/Salute','🧦 BABY/Abbigliamento']],
['Casa',['💡 LUCE','🕯️ GAS','💧 ACQUA','📞 TELEFONO','🏠 CONDOMINIO','🏘️ CONDOMINIO AREA CORTILIVA','🗑️ TARI']],
['Trasporto',['🚗 Varie','🚗 AUTO_FORD_Altro','🚗 Auto_Moto_Carburante','🚗 Auto_Moto_Altro']]];
const CI=['Salary EH','Salary ZX','Other EH&ZX','AUU MY','Passive Int'],TAX=['Taxes EH','Taxes ZX'];
const isTax=c=>TAX.includes(c);
const grpOf=c=>(GR.find(g=>g[1].includes(c))||['Altro'])[0];
const MN=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
let tab='home',hv='m',month=today().slice(0,7),yr=today().slice(0,4),iv={v:'list',id:null},ed=null;
const eur=n=>n.toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const eur0=n=>n.toLocaleString('it-IT',{maximumFractionDigits:0})+' €';
const sg=n=>(n>=0?'+':'−')+eur(Math.abs(n));
const pct=n=>(n>=0?'+':'−')+Math.abs(n).toFixed(2).replace('.',',')+'%';
const num=id=>parseFloat(String($('#'+id).value||'').replace(',','.'));
const fd=d=>new Date(d+'T00:00').toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'2-digit'});
const mName=m=>{const [y,mo]=m.split('-');return new Date(y,mo-1,1).toLocaleDateString('it-IT',{month:'long',year:'numeric'})};
const shift=d=>{const [y,m]=month.split('-').map(Number);const dt=new Date(y,m-1+d,1);month=dt.getFullYear()+'-'+pad(dt.getMonth()+1);render()};
let UC=0;const uid=()=>Date.now().toString(36)+(++UC).toString(36)+Math.random().toString(36).slice(2,6);
const sum=(a,t)=>a+t.amount,byD=(x,y)=>x.date.localeCompare(y.date);
const real=()=>S.tx.filter(t=>t.type!=='pay');
const monthTx=()=>real().filter(t=>t.date.startsWith(month)).sort((a,b)=>byD(b,a));
const nextM=d=>{const [y,m,dd]=d.split('-').map(Number),l=new Date(y,m+1,0).getDate(),t=new Date(y,m,Math.min(dd,l));return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate())};
const mnav=()=>`<div class="mnav"><button class="ghost" onclick="shift(-1)">‹</button><b>${mName(month)}</b><button class="ghost" onclick="shift(1)">›</button></div>`;
const seg=()=>`<div class="seg"><button class="${hv==='m'?'on':''}" onclick="hv='m';render()">Mese</button><button class="${hv==='y'?'on':''}" onclick="hv='y';render()">Anno</button></div>`;
const legend=(a,b,va,vb)=>`<div class="leg"><span><i style="background:var(--main)"></i>${a}${va?': <b>'+va+'</b>':''}</span>${b?`<span><i style="background:var(--alt)"></i>${b}${vb?': <b>'+vb+'</b>':''}</span>`:''}</div>`;
const SPESA='🍲 SPESA';
let F={q:'',y:today().slice(0,4),m:today().slice(5,7),d:'',g:'',c:'',t:''};
const CHT=['ETF','BTP','Azione','Altro'];
let CH={view:'tot',paid:true,scope:'all',types:['ETF','BTP','Azione','Altro'],ser:['v','c'],rng:'max',from:'',to:''};
const CHD={},NCOL=['#0f8b8d','#b7791f','#6a4fc2','#c2410c','#2563eb','#15803d','#be185d','#64748b','#0e7490','#a16207','#7c3aed','#dc2626','#059669','#475569','#d97706','#0284c7'];
let nwv='dash',nwm=today().slice(0,7),nwsec='cash',NS={rng:'12',ser:['nw']};

/* ---------- grafici ---------- */
function bars(items,na,nb,va,vb){
  const W=340,H=170,pb=22,pt=16,pl=4,one=!nb,mx=Math.max(1,...items.flatMap(i=>[i.a,i.b||0])),n=items.length,gw=(W-pl*2)/n,bw=one?Math.min(28,gw-4):Math.min(24,gw/2-2),y=v=>pt+(H-pt-pb)*(1-v/mx),st=Math.ceil(n/12);
  const lab=(v,x)=>n<=4?`<text x="${x}" y="${y(v)-3}" font-size="8" text-anchor="middle" fill="var(--ink)">${eur0(v)}</text>`:'';
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto"><text x="${pl}" y="10" font-size="9" fill="var(--mute)">${eur0(mx)}</text><line x1="0" x2="${W}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/>`;
  items.forEach((it,i)=>{const cx=pl+gw*i+gw/2;
    s+=one?`<rect x="${cx-bw/2}" y="${y(it.a)}" width="${bw}" height="${H-pb-y(it.a)}" fill="var(--main)" rx="2"><title>${esc(it.l)} · ${na}: ${eur(it.a)}</title></rect>${lab(it.a,cx)}`
    :`<rect x="${cx-bw-1}" y="${y(it.a)}" width="${bw}" height="${H-pb-y(it.a)}" fill="var(--main)" rx="2"><title>${esc(it.l)} · ${na}: ${eur(it.a)}</title></rect><rect x="${cx+1}" y="${y(it.b)}" width="${bw}" height="${H-pb-y(it.b)}" fill="var(--alt)" rx="2"><title>${esc(it.l)} · ${nb}: ${eur(it.b)}</title></rect>${lab(it.a,cx-bw/2-1)}${lab(it.b,cx+bw/2+1)}`;
    if(i%st===0)s+=`<text x="${cx}" y="${H-8}" font-size="9" text-anchor="middle" fill="var(--mute)">${esc(it.l)}</text>`});
  return legend(na,nb,va,vb)+s+'</svg>';
}
function lines(p,na,nb){
  if(!p.length)return '<div class="empty">Nessun dato da mostrare.</div>';
  const W=340,H=150,pl=4,pb=18,pt=14,t0=Date.parse(p[0].d),t1=Date.parse(p[p.length-1].d),vs=p.flatMap(x=>[x.a,x.b]),mn=Math.min(...vs),mx=Math.max(...vs),L=p[p.length-1];
  const x=d=>p.length<2||t1===t0?W/2:pl+8+(Date.parse(d)-t0)/(t1-t0)*(W-pl*2-16),y=v=>pt+(H-pt-pb)*(1-(mx===mn?.5:(v-mn)/(mx-mn)));
  const pa=k=>p.map(q=>x(q.d).toFixed(1)+','+y(q[k]).toFixed(1)).join(' ');
  const dots=(k,c)=>p.map(q=>`<circle cx="${x(q.d).toFixed(1)}" cy="${y(q[k]).toFixed(1)}" r="3" fill="${c}"><title>${fd(q.d)} · ${eur(q[k])}</title></circle>`).join('');
  const an=p.length>1?'end':'middle',lx=x(L.d)-(p.length>1?4:0),up=L.a>=L.b;
  const tl=(v,c,dy)=>`<text x="${lx}" y="${(y(v)+dy).toFixed(1)}" font-size="9" font-weight="700" text-anchor="${an}" fill="${c}">${eur0(v)}</text>`;
  return legend(na,nb,eur0(L.a),eur0(L.b))+`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto"><text x="${pl}" y="9" font-size="9" fill="var(--mute)">${eur0(mx)}</text><text x="${pl}" y="${H-pb-3}" font-size="9" fill="var(--mute)">${eur0(mn)}</text><line x1="0" x2="${W}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/>
  <polyline points="${pa('b')}" fill="none" stroke="var(--alt)" stroke-width="2"/><polyline points="${pa('a')}" fill="none" stroke="var(--main)" stroke-width="2"/>${dots('b','var(--alt)')}${dots('a','var(--main)')}${tl(L.a,'var(--main)',up?-6:12)}${tl(L.b,'var(--alt)',up?12:-6)}
  <text x="${pl}" y="${H-4}" font-size="9" fill="var(--mute)">${fd(p[0].d)}</text><text x="${W-pl}" y="${H-4}" font-size="9" text-anchor="end" fill="var(--mute)">${fd(L.d)}</text></svg>`;
}

/* ---------- riepilogo ---------- */
function txRow(t){
  const s=t.type==='in'&&!isTax(t.cat)?1:-1,bp=t.bp?` · 🎟 buoni ${eur(t.bpv)} + resto ${eur(t.bpr)}`:'',
  pay=t.pay&&t.gross?` · Lordo ${eur(t.gross)} · Trattenute ${eur(t.ded||0)} (${(t.pct||0).toFixed(1).replace('.',',')}%)`:'';
  return `<div class="tx row"><div><div>${esc(t.cat)}${t.company?' · '+esc(t.company):''}${t.note?' · '+esc(t.note):''}</div><div class="mute">${fd(t.date)}${bp}${pay}</div></div><div class="row"><b class="${s>0?'in':'out'}">${s>0?'+':'−'}${eur(t.amount)}</b><button class="ic" onclick="openForm('${t.id}','edit')" aria-label="Modifica">✎</button><button class="ic" onclick="openForm('${t.id}','dup')" aria-label="Duplica nel mese successivo">⧉</button><button class="del" onclick="del('${t.id}')" aria-label="Elimina">✕</button></div></div>`;
}
const split=tx=>{const ins=tx.filter(t=>t.type==='in'),gross=ins.filter(t=>!isTax(t.cat)).reduce(sum,0),tax=ins.filter(t=>isTax(t.cat)).reduce(sum,0);return{ins,gross,tax,net:gross-tax,outs:tx.filter(t=>t.type==='out'),out:tx.filter(t=>t.type==='out').reduce(sum,0)}};
function home(){return `<h1>Fin-Fam</h1>${seg()}${hv==='y'?yearView():monthView()}`}
function monthView(){
  const {ins,gross,tax,net,outs,out}=split(monthTx()),g={},bpTot=outs.reduce((a,t)=>a+(t.bp?t.bpv:0),0),pg=ins.reduce((a,t)=>a+(t.pay?t.gross||0:0),0),pd=ins.reduce((a,t)=>a+(t.pay?t.ded||0:0),0);
  outs.forEach(t=>{const k=grpOf(t.cat);g[k]=g[k]||{tot:0,c:{}};g[k].tot+=t.amount;(g[k].c[t.cat]=g[k].c[t.cat]||[]).push(t)});
  return `${mnav()}<div class="card"><div class="mute">Saldo del mese</div><div class="big ${net-out<0?'out':'in'}">${eur(net-out)}</div><div style="margin-top:2px"><span class="mute">Saving</span> <b>${sav(net,net-out)}</b></div>
  <div class="row" style="margin-top:8px"><span class="in">Entrate nette ${eur(net)}</span><span class="out">Uscite ${eur(out)}</span></div>
  ${pg?`<div class="mute" style="margin-top:4px">Lordo buste paga ${eur(pg)} · Trattenute ${eur(pd)}</div>`:''}${bpTot?`<div class="mute">🎟 Buoni pasto usati: ${eur(bpTot)}</div>`:''}</div>
  ${agosCard(net,out,month)}${ins.length?`<details class="card"><summary class="row"><b>Entrate</b><b class="in">${eur(net)} ▾</b></summary>${ins.map(txRow).join('')}</details>`:''}
  <h2>Spese per categoria</h2>${Object.keys(g).length?Object.entries(g).sort((a,b)=>b[1].tot-a[1].tot).map(([n,x])=>`<div class="card"><div class="row"><b>${esc(n)}</b><b>${eur(x.tot)}</b></div><div style="height:8px"></div>${Object.entries(x.c).sort((a,b)=>b[1].reduce(sum,0)-a[1].reduce(sum,0)).map(([c,l])=>{const v=l.reduce(sum,0);return `<details><summary class="row"><span>${esc(c)} ▾</span><span>${eur(v)}</span></summary>${l.map(txRow).join('')}</details><div class="bar"><i style="width:${v/out*100}%"></i></div>`}).join('')}</div>`).join(''):'<div class="card empty">Nessuna spesa questo mese.<br>Tocca “Aggiungi” per registrarne una.</div>'}`;
}
function yearView(){
  const rows=[];
  for(let m=1;m<=12;m++){const tx=real().filter(t=>t.date.startsWith(yr+'-'+pad(m))),s=split(tx);rows.push({m,net:s.net,out:s.out,tx:s.outs})}
  const T=rows.reduce((a,r)=>({net:a.net+r.net,out:a.out+r.out}),{net:0,out:0}),names=[...GR.map(g=>g[0]),'Altro'];
  return `<div class="mnav"><button class="ghost" onclick="yr=String(+yr-1);render()">‹</button><b>${yr}</b><button class="ghost" onclick="yr=String(+yr+1);render()">›</button></div>
  <div class="card"><div class="mute">Saldo dell’anno</div><div class="big ${T.net-T.out<0?'out':'in'}">${eur(T.net-T.out)}</div><div style="margin-top:2px"><span class="mute">Saving</span> <b>${sav(T.net,T.net-T.out)}</b></div><div class="row" style="margin-top:8px"><span class="in">Entrate nette ${eur(T.net)}</span><span class="out">Uscite ${eur(T.out)}</span></div></div>
  ${payCard(real().filter(t=>t.date.startsWith(yr)))}<h2>Entrate nette e uscite per mese</h2><div class="card">${bars(rows.map(r=>({l:MN[r.m-1],a:Math.max(0,r.net),b:r.out})),'Entrate nette','Uscite','anno '+eur0(T.net),'anno '+eur0(T.out))}</div>
  <h2>Andamento mensile</h2><div class="card" style="overflow-x:auto"><table><tr><th>Mese</th><th>Entrate</th><th>Uscite</th><th>Saldo</th><th>Sav.</th></tr>
  ${rows.map(r=>`<tr onclick="month='${yr}-${pad(r.m)}';hv='m';render()" style="cursor:pointer"><td>${MN[r.m-1]}</td><td>${eur0(r.net)}</td><td>${eur0(r.out)}</td><td class="${r.net-r.out<0?'out':'in'}">${eur0(r.net-r.out)}</td><td>${sav(r.net,r.net-r.out)}</td></tr>`).join('')}
  <tr><th>Totale</th><th>${eur0(T.net)}</th><th>${eur0(T.out)}</th><th>${eur0(T.net-T.out)}</th><th>${sav(T.net,T.net-T.out)}</th></tr></table><div class="mute" style="margin-top:6px">Tocca un mese per aprirlo.</div></div>
  ${agosYear(rows)}<h2>Uscite per gruppo e mese</h2><div class="card" style="overflow-x:auto"><table><tr><th></th>${MN.map(m=>`<th>${m}</th>`).join('')}<th>Tot.</th></tr>
  ${names.map(n=>{const c=rows.map(r=>r.tx.filter(t=>grpOf(t.cat)===n).reduce(sum,0)),t=c.reduce((a,b)=>a+b,0);return t?`<tr><td>${n}</td>${c.map(v=>`<td>${v?eur0(v).replace(' €',''):'–'}</td>`).join('')}<th>${eur0(t).replace(' €','')}</th></tr>`:''}).join('')}</table><div class="mute" style="margin-top:6px">Importi in euro.</div></div>`;
}

/* ---------- aggiungi / modifica / duplica ---------- */
function openForm(id,mode){ed={id,mode};tab='add';render();scrollTo(0,0)}
function add(){
  const t=ed&&S.tx.find(x=>x.id===ed.id),title=!t?'Aggiungi':ed.mode==='edit'?'Modifica voce':'Duplica voce',
  fl=(id,l,v,ex='')=>`<div><label>${l}</label><input id="${id}" type="number" inputmode="decimal" step="0.01" min="0" value="${t&&t.pay&&v?v:''}" ${ex}></div>`;
  return `<h1>${title}</h1>${t?'':voiceCard()}${t&&ed.mode==='dup'?'<p class="mute" style="margin-top:-6px">Copia nel mese successivo: controlla importo e data, poi salva.</p>':''}<div class="card">
  <label>Tipo</label><select id="f-type" onchange="setCats()"><option value="out">Spesa</option><option value="in">Entrata</option></select>
  <label>Categoria</label><select id="f-cat" onchange="catChg()"></select>
  <label id="f-amtl">Importo (€)</label><input id="f-amt" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0,00" value="${t?t.amount:''}" oninput="payCalc()">
  <div id="f-bp" hidden style="margin-bottom:12px"><label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input id="f-bpc" type="checkbox" style="width:auto;margin:0" onchange="bpTog()"> Pagata con buoni pasto</label>
  <div id="f-bpf" hidden style="margin-top:10px"><label>Importo pagato con i buoni pasto (€)</label><input id="f-bpv" type="number" inputmode="decimal" step="0.01" min="0" oninput="bpSum()" value="${t&&t.bp?t.bpv:''}">

/* ---------- investimenti ---------- */
const fac=a=>a.kind==='BTP'?0.01:1;
function series(a){
  const m={};
  a.ops.filter(o=>o.type!=='div').forEach(o=>m[o.date]={price:o.price,src:o.type==='buy'?'acquisto':'vendita'});
  (a.prices||[]).forEach(p=>m[p.date]={price:p.price,src:'m'});
  return Object.entries(m).sort((x,y)=>x[0].localeCompare(y[0])).map(([date,v])=>({date,...v}));
}
function pos(a,d='9999-12-31'){
  let q=0,cost=0,real=0,inc=0,incG=0,incT=0;
  [...a.ops].filter(o=>o.date<=d).sort(byD).forEach(o=>{
    if(o.type==='buy'){cost+=o.qty*o.price*fac(a)+(o.fee||0);q+=o.qty}
    else if(o.type==='sell'){const avg=q?cost/q:0;real+=o.qty*o.price*fac(a)-(o.fee||0)-avg*o.qty;cost-=avg*o.qty;q-=o.qty}
    else{inc+=o.amount;incG+=(o.gross!=null?o.gross:o.amount);incT+=(o.tax||0)}});
  if(q<1e-9){q=0;cost=0}
  return {q,cost,real,inc,incG,incT};
}
function calc(a){
  const p=pos(a),pts=series(a),last=pts[pts.length-1],prev=pts[pts.length-2],price=last?last.price:0,value=p.q*price*fac(a);
  return {...p,price,value,pl:value-p.cost,pts,last,prev,avg:p.q?p.cost/p.q/fac(a):0};
}
function timeline(as){
  const ds=[...new Set(as.flatMap(a=>[...a.ops.map(o=>o.date),...(a.prices||[]).map(p=>p.date)]))].sort();
  return ds.map(d=>{let v=0,c=0;as.forEach(a=>{const p=pos(a,d),s=series(a).filter(x=>x.date<=d),pr=s.length?s[s.length-1].price:0;v+=p.q*pr*fac(a);c+=p.cost});return {d,a:v,b:c}});
}
const vari=c=>c.prev?`<span class="${c.last.price>=c.prev.price?'in':'out'}">${pct((c.last.price/c.prev.price-1)*100)}</span> <span class="mute">da ${fd(c.prev.date)}</span>`:'<span class="mute">nessuna variazione ancora</span>';
const srcTag=c=>!c.last?'<span class="mute">nessun prezzo</span>':c.last.src==='m'?`<span class="in">✔ aggiornato a mano il ${fd(c.last.date)}</span>`:`<span class="out">⚠ da ${c.last.src} del ${fd(c.last.date)}</span>`;

function saveOp(){

function filt(){
  const q=F.q.trim().toLowerCase();
  return real().filter(t=>{
    const [y,m,d]=t.date.split('-');
    if(F.y&&y!==F.y||F.m&&m!==F.m||F.d&&d!==F.d||F.t&&t.type!==F.t||F.c&&t.cat!==F.c)return false;
